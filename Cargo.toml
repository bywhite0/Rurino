[package]
name = "Rurino"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "按需读取与无损导出的 Unity AssetBundle 工具"
license = "MIT"

[dependencies]
unity-rs-core = "=0.6.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
oxipng = { version = "=10.2.1", default-features = false }
image-webp = "=0.2.4"

[profile.release]
debug = 0
strip = "debuginfo"
